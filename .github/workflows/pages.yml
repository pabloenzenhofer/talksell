name: Publicar vista previa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Construir sitio
        run: npm run build

      - name: Adaptar rutas para la vista previa
        run: |
          find dist -type f -name '*.html' -exec sed -i 's|href="/|href="/talksell/|g; s|src="/|src="/talksell/|g' {} +
          touch dist/.nojekyll

      - name: Preparar publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
